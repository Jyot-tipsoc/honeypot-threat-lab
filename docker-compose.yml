version: "3.9"

# =============================================================
#  IoT Deception Honeypot Network — Healthcare Security Project
#  Docker Compose Orchestration
# =============================================================

networks:
  honeypot_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24   # isolated internal network

volumes:
  cowrie_logs:
  elastic_data:
  dashboard_db:

services:

  # ─────────────────────────────────────────────────────────
  # 1. COWRIE — SSH / Telnet medium-interaction honeypot
  # ─────────────────────────────────────────────────────────
  cowrie:
    build:
      context: ./cowrie
      dockerfile: Dockerfile
    container_name: cowrie_honeypot
    hostname: MED-IoT-Gateway-01       # looks like a medical IoT device
    networks:
      honeypot_net:
        ipv4_address: 172.20.0.10
    ports:
      - "2222:2222"    # SSH honeypot  (maps to host port 2222)
      - "2223:2223"    # Telnet honeypot
    volumes:
      - cowrie_logs:/cowrie/var/log/cowrie
      - ./cowrie/etc:/cowrie/etc/cowrie        # custom config
    environment:
      - COWRIE_HOSTNAME=MED-IoT-Gateway-01
    restart: unless-stopped
    read_only: false
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID

  # ─────────────────────────────────────────────────────────
  # 2. FAKE WEB PANEL — unauthenticated IoT admin interface
  # ─────────────────────────────────────────────────────────
  fake_panel:
    build:
      context: ./fake_panel
      dockerfile: Dockerfile
    container_name: fake_iot_panel
    hostname: MED-IoT-WebAdmin
    networks:
      honeypot_net:
        ipv4_address: 172.20.0.11
    ports:
      - "8080:80"   # exposes a fake unauth admin panel
    restart: unless-stopped
    cap_drop:
      - ALL

  # ─────────────────────────────────────────────────────────
  # 3. LOG SHIPPER — Filebeat forwards cowrie logs to Elastic
  # ─────────────────────────────────────────────────────────
  filebeat:
    image: docker.elastic.co/beats/filebeat:8.13.0
    container_name: filebeat
    user: root
    networks:
      honeypot_net:
        ipv4_address: 172.20.0.20
    volumes:
      - cowrie_logs:/cowrie/var/log/cowrie:ro
      - ./filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
    depends_on:
      - elasticsearch
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────
  # 4. ELASTICSEARCH — stores parsed attack logs
  # ─────────────────────────────────────────────────────────
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    container_name: elasticsearch
    networks:
      honeypot_net:
        ipv4_address: 172.20.0.30
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - elastic_data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q 'green\\|yellow'"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ─────────────────────────────────────────────────────────
  # 5. THREAT DASHBOARD — Python Flask + live threat map
  # ─────────────────────────────────────────────────────────
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: threat_dashboard
    networks:
      honeypot_net:
        ipv4_address: 172.20.0.40
    ports:
      - "5000:5000"
    volumes:
      - cowrie_logs:/cowrie_logs:ro
      - dashboard_db:/app/db
    environment:
      - ES_HOST=http://elasticsearch:9200
      - FLASK_ENV=production
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────
  # 6. LOG PARSER — Python worker that enriches logs with GeoIP
  # ─────────────────────────────────────────────────────────
  log_parser:
    build:
      context: ./scripts
      dockerfile: Dockerfile
    container_name: log_parser
    networks:
      honeypot_net:
        ipv4_address: 172.20.0.50
    volumes:
      - cowrie_logs:/cowrie_logs:ro
      - dashboard_db:/app/db
    environment:
      - ES_HOST=http://elasticsearch:9200
      - PARSE_INTERVAL=30
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────
  # 7. NGINX — reverse proxy / single entry point
  # ─────────────────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: nginx_proxy
    networks:
      honeypot_net:
        ipv4_address: 172.20.0.60
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - dashboard
    restart: unless-stopped
